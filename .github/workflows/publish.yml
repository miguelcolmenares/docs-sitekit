name: Publish

on:
  push:
    tags: ["v*"]

# Trusted publishing: npm exchanges this OIDC token for publish rights. There is no NPM_TOKEN.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            template/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1
          fi
      - run: npm ci
      # The tests and the type check import code from template/, which has its own dependencies.
      - run: npm ci --prefix template
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The first version of a package is published by hand, because a new name cannot have a trusted
      # publisher until it exists. The tag that follows must not fail on a version that is already there.
      - name: Is this version already on npm?
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm, so there is nothing to publish."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm publish
