name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            template/package-lock.json
      - run: npm ci
      # The tests and the type check import code from template/, which has its own dependencies.
      - run: npm ci --prefix template
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tsdoc:
    name: TSDoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Complete, not only valid: every export of our own code has a comment. The components in
      # components/ui come from shadcn and are generated, so they are left out.
      - uses: miguelcolmenares/jsdoc-to-tsdoc@78f159f0774ab8d1532c8b14437676dd34d36f6c # v1.0.0
        with:
          command: check
          version: "1.0.0"
          node-version: "26"
          exclude: "**/components/ui/**"

  package-and-e2e:
    name: Pack, install and e2e
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            template/package-lock.json
      - run: npm ci
      # The tests and the type check import code from template/, which has its own dependencies.
      - run: npm ci --prefix template
      - run: npx playwright install --with-deps chromium
      # Packs the tarball, installs it, runs the CLI on a throwaway repository, builds the site it
      # generates, and then drives that site in a browser on a phone and a desktop.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The composite action, run for real on a small repository that this commit's CLI initialised.
  # `check` is off because it runs the published CLI, which does not exist before the first release.
  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            template/package-lock.json
      - run: npm ci
      - run: npm ci --prefix template
      - run: npm run build
      - name: Make a small repository inside the workspace
        run: |
          mkdir -p smoke/docs
          cat > smoke/package.json <<'JSON'
          { "name": "smoke", "version": "1.0.0", "description": "A repository to smoke test the action.", "license": "MIT" }
          JSON
          cat > smoke/docs/hello.md <<'MARKDOWN'
          # Hello

          A first page.
          MARKDOWN
          node dist/cli.js init --root smoke
      - id: build
        uses: ./
        with:
          dir: smoke/site
          check: "false"
          upload: "false"
      - name: The action built the site and reported where
        env:
          DIST: ${{ steps.build.outputs.dist }}
        run: |
          test "$DIST" = "smoke/site/dist"
          test -f "$DIST/index.html"
          test -f "$DIST/docs/hello/index.html"
          test -f "$DIST/404.html"
          grep -q "<title>Hello" "$DIST/docs/hello/index.html"
          grep -q ">v1.0.0<" "$DIST/index.html"
